<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="favicon.png">

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ساخت کپشن فروشگاهی | شما شاپ</title>

    <link
        href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
        rel="stylesheet"
    >

    <style>
        /* ==================== Scrollbar ==================== */

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        * {
            scrollbar-color: #333 transparent;
            scrollbar-width: thin;
        }

        /* ==================== Variables ==================== */

        :root {
            --bg: #0f0f0f;
            --surface: rgba(30, 30, 30, 0.8);
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(20, 20, 20, 0.7);

            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;

            --error: #e17055;
            --success: #00b894;

            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --blur: 12px;
            --transition: 0.3s ease;

            --header-bg: rgba(15, 15, 15, 0.6);
        }

        body.light-mode {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.75);
            --text: #1a1a1a;
            --text-secondary: #555;
            --border: rgba(0, 0, 0, 0.06);
            --input-bg: rgba(240, 240, 240, 0.8);

            --accent: #6c5ce7;
            --accent-hover: #5a4bd1;

            --error: #d63031;
            --success: #00b894;

            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --header-bg: rgba(255, 255, 255, 0.5);
        }

        body.light-mode ::-webkit-scrollbar-thumb {
            background: #ccc;
        }

        body.light-mode ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        body.light-mode {
            scrollbar-color: #ccc transparent;
        }

        /* ==================== Reset ==================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ==================== Body ==================== */

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);

            height: 100vh;

            display: flex;
            flex-direction: column;

            transition:
                background var(--transition),
                color var(--transition);

            -webkit-font-smoothing: antialiased;

            overflow: hidden;
        }

        /* ==================== Header ==================== */

        .app-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 1rem;

            padding: 0.5rem 1.5rem;

            background: var(--header-bg);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-bottom: 1px solid var(--border);

            z-index: 10;
            flex-shrink: 0;
        }

        .theme-toggle-btn {
            background: transparent;

            border: 1px solid var(--border);
            border-radius: 50px;

            padding: 0.4rem 1rem;

            cursor: pointer;

            font-size: 1.1rem;
            color: var(--text);

            transition: all var(--transition);

            display: flex;
            align-items: center;

            gap: 0.4rem;

            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);

            font-family: 'Vazirmatn', sans-serif;
        }

        .theme-toggle-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .made-by-link {
            color: var(--text-secondary);
            text-decoration: none;

            font-size: 0.8rem;
            font-weight: 400;

            transition: color var(--transition);

            white-space: nowrap;
        }

        .made-by-link:hover {
            color: var(--accent);
        }

        /* ==================== Main ==================== */

        .main-container {
            display: flex;

            flex: 1;

            height: calc(100vh - 52px);

            gap: 1.2rem;

            padding: 1.2rem;

            overflow: hidden;
        }

        /* ==================== Cards ==================== */

        .card {
            background: var(--surface);

            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));

            border: 1px solid var(--border);
            border-radius: var(--radius);

            box-shadow: var(--shadow);

            padding: 1.25rem;

            transition:
                background var(--transition),
                border var(--transition);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* ==================== Sections ==================== */

        .form-section {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }

        .preview-section {
            flex: 1;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }

        /* ==================== Titles ==================== */

        .section-title {
            font-size: 1rem;
            font-weight: 600;

            margin-bottom: 1rem;

            color: var(--text);

            letter-spacing: -0.2px;

            display: flex;
            align-items: center;

            gap: 0.4rem;

            flex-shrink: 0;
        }

        /* ==================== Form Scroll ==================== */

        .form-grid {
            display: flex;
            flex-direction: column;

            gap: 0.8rem;

            flex: 1;

            overflow-y: auto;

            padding-right: 2px;

            /*
             * مهم:
             * خود ناحیه اسکرول LTR است تا scrollbar
             * در سمت راست قرار بگیرد.
             */
            direction: ltr;
        }

        /*
         * محتوای داخل فرم همچنان RTL باقی می‌ماند.
         */
        .form-grid > * {
            direction: rtl;
        }

        /* ==================== Inputs ==================== */

        .input-group {
            display: flex;
            flex-direction: column;

            gap: 0.25rem;

            position: relative;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 500;

            color: var(--text-secondary);

            display: flex;
            align-items: center;

            gap: 0.35rem;
        }

        .required-mark {
            color: var(--error);

            font-size: 1rem;
            line-height: 1;
        }

        .optional-mark {
            font-size: 0.65rem;

            background: var(--border);
            color: var(--text-secondary);

            padding: 0.1rem 0.5rem;

            border-radius: 20px;

            font-weight: 400;
        }

        .input-wrapper {
            position: relative;

            display: flex;
            align-items: center;
        }

        .input-group input {
            background: var(--input-bg);

            border: 1.5px solid var(--border);
            border-radius: 10px;

            padding: 0.65rem 2.2rem 0.65rem 0.8rem;

            font-family: 'Vazirmatn', sans-serif;

            font-size: 0.85rem;

            color: var(--text);

            transition: all var(--transition);

            outline: none;

            width: 100%;

            direction: rtl;
            text-align: right;
        }

        .input-group input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .input-group input::placeholder {
            color: #666;
            font-size: 0.75rem;
        }

        /* ==================== Clear Field ==================== */

        .clear-field-btn {
            position: absolute;

            left: 0.5rem;
            top: 50%;

            transform: translateY(-50%);

            background: transparent;

            border: none;

            color: var(--text-secondary);

            font-size: 1.2rem;

            cursor: pointer;

            width: 1.8rem;
            height: 1.8rem;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            transition: all var(--transition);

            opacity: 0;
            pointer-events: none;

            z-index: 2;
        }

        .input-wrapper.has-value .clear-field-btn {
            opacity: 0.6;
            pointer-events: auto;
        }

        .clear-field-btn:hover {
            opacity: 1 !important;

            background: rgba(255, 255, 255, 0.1);

            color: var(--error);
        }

        /* ==================== Errors ==================== */

        .error-message {
            color: var(--error);

            font-size: 0.8rem;
            font-weight: 500;

            margin-top: 0.2rem;

            display: none;

            align-items: center;

            gap: 0.3rem;
        }

        .error-message.visible {
            display: flex;
        }

        /* ==================== Action Buttons ==================== */

        .action-buttons {
            display: flex;

            gap: 0.6rem;

            margin-top: 0.6rem;

            flex-shrink: 0;
        }

        .btn {
            font-family: 'Vazirmatn', sans-serif;

            font-size: 0.8rem;
            font-weight: 500;

            padding: 0.6rem 1.2rem;

            border-radius: 10px;

            border: none;

            cursor: pointer;

            transition: all var(--transition);

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 0.4rem;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);

            box-shadow:
                0 4px 14px rgba(108, 92, 231, 0.35);

            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;

            border: 1.5px solid var(--border);

            color: var(--text-secondary);

            flex: 1;
        }

        .btn-outline:hover {
            border-color: #888;

            color: var(--text);

            background: rgba(255, 255, 255, 0.05);
        }

        /* ==================== Preview ==================== */

        .preview-box {
            background: rgba(0, 0, 0, 0.2);

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 1rem;

            flex: 1;

            font-size: 0.9rem;

            line-height: 1.9;

            white-space: pre-wrap;

            word-wrap: break-word;

            color: var(--text);

            outline: none;

            transition: border var(--transition);

            overflow-y: auto;

            min-height: 0;

            direction: rtl;
            text-align: right;
        }

        .preview-box:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .preview-box[contenteditable="true"]:empty::before {
            content:
                "پیش‌نمایش کپشن در اینجا ظاهر می‌شود...";

            color: #666;

            font-style: italic;
        }

        /* ==================== Copy Buttons ==================== */

        .copy-row {
            display: flex;

            width: 100%;

            gap: 0.6rem;

            margin-top: 0.8rem;

            flex-shrink: 0;
        }

        .copy-row .btn {
            flex: 1;

            width: 100%;

            min-width: 0;
        }

        /* ==================== Copy Notification ==================== */

        .copy-feedback {
            position: fixed;

            top: 20px;
            left: 50%;

            transform:
                translateX(-50%)
                translateY(-15px);

            background: var(--surface);

            color: var(--text);

            border: 1px solid var(--border);

            border-radius: 10px;

            padding: 0.55rem 1rem;

            font-size: 0.78rem;
            font-weight: 600;

            box-shadow: var(--shadow);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            z-index: 9999;

            white-space: nowrap;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0.2s ease;
        }

        .copy-feedback.show {
            opacity: 1;

            visibility: visible;

            transform:
                translateX(-50%)
                translateY(0);
        }

        /* ==================== Mobile ==================== */

        @media (max-width: 768px) {

            body {
                overflow-y: auto;
                height: auto;
            }

            .main-container {
                flex-direction: column;

                height: auto;

                padding: 1rem;

                gap: 1rem;

                overflow-y: visible;
            }

            .form-section,
            .preview-section {
                flex: none;

                width: 100%;

                overflow-y: visible;

                height: auto;
            }

            .form-grid {
                direction: ltr;
            }

            .form-grid > * {
                direction: rtl;
            }

            .preview-box {
                min-height: 180px;
            }

            .copy-row {
                display: flex;

                width: 100%;
            }

            .copy-row .btn {
                flex: 1;

                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ==================== Main ==================== -->

    <script>
        (function () {

            // ==================== DOM ====================

            const productNameEl =
                document.getElementById('productName');

            const priceEl =
                document.getElementById('price');

            const discountPriceEl =
                document.getElementById('discountPrice');

            const weightEl =
                document.getElementById('weight');

            const quantityEl =
                document.getElementById('quantity');

            const scentEl =
                document.getElementById('scent');

            const customTitleEl =
                document.getElementById('customTitle');

            const customValueEl =
                document.getElementById('customValue');


            const nameLengthError =
                document.getElementById(
                    'nameLengthError'
                );

            const priceError =
                document.getElementById(
                    'priceError'
                );

            const discountError =
                document.getElementById(
                    'discountError'
                );

            const discountCompareError =
                document.getElementById(
                    'discountCompareError'
                );


            const previewOutput =
                document.getElementById(
                    'previewOutput'
                );


            const copyEitaaBtn =
                document.getElementById(
                    'copyEitaaBtn'
                );

            const copyRubikaBtn =
                document.getElementById(
                    'copyRubikaBtn'
                );


            const clearFormBtn =
                document.getElementById(
                    'clearFormBtn'
                );


            const copyFeedback =
                document.getElementById(
                    'copyFeedback'
                );


            const themeToggle =
                document.getElementById(
                    'themeToggle'
                );

            const themeIcon =
                document.getElementById(
                    'themeIcon'
                );

            const themeLabel =
                document.getElementById(
                    'themeLabel'
                );


            const allClearButtons =
                document.querySelectorAll(
                    '.clear-field-btn'
                );


            const allInputs = [
                productNameEl,
                priceEl,
                discountPriceEl,
                weightEl,
                quantityEl,
                scentEl,
                customTitleEl,
                customValueEl
            ];


            // ==================== Platform Links ====================

            const PLATFORM_LINKS = {

                eitaa:
                    'https://eitaa.com/shoma_shop/12',

                rubika:
                    'https://rubika.ir/shoma_shop/BHBJBCCDHAJFJFHJ'

            };


            const DEFAULT_PLATFORM = 'eitaa';


            // ==================== Helpers ====================

            const toEnglishDigits = (str) => {

                return str.replace(
                    /[۰-۹]/g,
                    d =>
                        String.fromCharCode(
                            d.charCodeAt(0) - 1728
                        )
                );

            };


            const toPersianDigits = (str) => {

                return str.replace(
                    /[0-9]/g,
                    d =>
                        String.fromCharCode(
                            d.charCodeAt(0) + 1728
                        )
                );

            };


            function normalizeText(str) {

                return str
                    .replace(/\u200C/g, ' ')
                    .trim()
                    .replace(/\s+/g, ' ');

            }


            function removeDuplicateWords(str) {

                const words =
                    str.split(' ');

                const result = [];

                for (const word of words) {

                    if (
                        result.length === 0 ||
                        word !==
                            result[
                                result.length - 1
                            ]
                    ) {

                        result.push(word);

                    }

                }

                return result.join(' ');
            }


            // ==================== Product Shortcuts ====================

            function transformProductName(name) {

                if (!name) {
                    return name;
                }


                const rules = [

                    {
                        prefixes: [
                            'مایع ظرفشویی',
                            'مایع ظرف',
                            'ظرف'
                        ],
                        replacement:
                            'مایع ظرفشویی (ریکا)'
                    },

                    {
                        prefixes: [
                            'مایع دستشویی',
                            'مایع دست'
                        ],
                        replacement:
                            'مایع دستشویی'
                    },

                    {
                        prefixes: [
                            'دستی'
                        ],
                        replacement:
                            'پودر دستی (تاید)',
                        exact: true
                    },

                    {
                        prefixes: [
                            'دست'
                        ],
                        replacement:
                            'مایع دستشویی',
                        exact: true
                    },

                    {
                        prefixes: [
                            'ریکا'
                        ],
                        replacement:
                            'مایع ظرفشویی (ریکا)'
                    },

                    {
                        prefixes: [
                            'ماشینی'
                        ],
                        replacement:
                            'پودر ماشینی (تاید)'
                    },

                    {
                        prefixes: [
                            'سفید کننده',
                            'سفیدکننده'
                        ],
                        replacement:
                            'سفید کننده (وایتکس)'
                    },

                    {
                        prefixes: [
                            'رخشا'
                        ],
                        replacement:
                            'پودر رخشا'
                    },

                    {
                        prefixes: [
                            'گلنار'
                        ],
                        replacement:
                            'صابون گلنار'
                    },

                    {
                        prefixes: [
                            'مای لیدی',
                            'مولپد',
                            'گود مود',
                            'گودمود'
                        ],
                        replacement:
                            prefix =>
                                `نوار بهداشتی ${prefix}`
                    },

                    {
                        prefixes: [
                            'رختشویی',
                            'رخت شویی'
                        ],
                        replacement:
                            'صابون رختشویی'
                    },

                    {
                        prefixes: [
                            'خمیر دندان',
                            'خمیردندان',
                            'خمیر دندون',
                            'خمیردندون'
                        ],
                        replacement:
                            'خمیردندان'
                    },

                    {
                        prefixes: [
                            'تیرک'
                        ],
                        replacement:
                            'تیرک (جرم گیر)'
                    }

                ];


                for (const rule of rules) {

                    for (
                        const prefix
                        of rule.prefixes
                    ) {

                        const matches =
                            rule.exact
                                ? name === prefix
                                : name.startsWith(
                                      prefix
                                  );


                        if (!matches) {
                            continue;
                        }


                        let rest =
                            name
                                .slice(
                                    prefix.length
                                )
                                .trim();


                        const prefixesToStrip =
                            rule.prefixes;


                        let changed = true;


                        while (
                            changed &&
                            rest.length > 0
                        ) {

                            changed = false;


                            for (
                                const p
                                of prefixesToStrip
                            ) {

                                if (
                                    rest.startsWith(
                                        p
                                    )
                                ) {

                                    rest =
                                        rest
                                            .slice(
                                                p.length
                                            )
                                            .trim();

                                    changed = true;

                                    break;
                                }

                            }

                        }


                        const replacement =
                            typeof rule.replacement ===
                            'function'

                                ? rule.replacement(
                                      prefix
                                  )

                                : rule.replacement;


                        return rest
                            ? `${replacement} ${rest}`
                            : replacement;
                    }

                }


                return name;
            }


            // ==================== Errors ====================

            function updateErrorDisplays() {

                const rawName =
                    normalizeText(
                        productNameEl.value
                    );


                const transformed =
                    transformProductName(
                        rawName
                    );


                const deduped =
                    removeDuplicateWords(
                        transformed
                    );


                nameLengthError.classList.toggle(
                    'visible',
                    rawName &&
                        deduped.length > 40
                );


                const priceVal =
                    priceEl.value.trim();


                priceError.classList.toggle(
                    'visible',
                    priceVal &&
                        !/^[0-9۰-۹]+$/.test(
                            priceVal
                        )
                );


                const discountVal =
                    discountPriceEl.value.trim();


                discountError.classList.toggle(
                    'visible',
                    discountVal &&
                        !/^[0-9۰-۹]+$/.test(
                            discountVal
                        )
                );


                discountCompareError.classList.remove(
                    'visible'
                );


                if (
                    discountVal &&
                    /^[0-9۰-۹]+$/.test(
                        discountVal
                    ) &&
                    priceVal &&
                    /^[0-9۰-۹]+$/.test(
                        priceVal
                    )
                ) {

                    const p =
                        parseInt(
                            toEnglishDigits(
                                priceVal
                            ),
                            10
                        );


                    const d =
                        parseInt(
                            toEnglishDigits(
                                discountVal
                            ),
                            10
                        );


                    if (d >= p) {

                        discountCompareError.classList.add(
                            'visible'
                        );

                    }

                }

            }


            // ==================== Build Caption ====================

            function buildCaption(
                platform = DEFAULT_PLATFORM
            ) {

                const rawName =
                    normalizeText(
                        productNameEl.value
                    );


                const transformed =
                    transformProductName(
                        rawName
                    );


                const name =
                    removeDuplicateWords(
                        transformed
                    );


                const priceVal =
                    priceEl.value.trim();


                const discountVal =
                    discountPriceEl.value.trim();


                const weightVal =
                    normalizeText(
                        weightEl.value
                    );


                const quantityVal =
                    normalizeText(
                        quantityEl.value
                    );


                const scentVal =
                    normalizeText(
                        scentEl.value
                    );


                const customTitle =
                    normalizeText(
                        customTitleEl.value
                    );


                const customValue =
                    normalizeText(
                        customValueEl.value
                    );


                const lines = [];


                if (rawName) {

                    lines.push(name);

                }


                if (priceVal) {

                    const displayPrice =
                        /^[0-9۰-۹]+$/.test(
                            priceVal
                        )

                            ? toEnglishDigits(
                                  priceVal
                              )

                            : priceVal;


                    lines.push(
                        `قیمت : ${displayPrice}`
                    );

                }


                if (discountVal) {

                    let displayDiscount =
                        discountVal;


                    if (
                        /^[0-9۰-۹]+$/.test(
                            discountVal
                        )
                    ) {

                        displayDiscount =
                            toEnglishDigits(
                                discountVal
                            );

                    }


                    lines.push(
                        `با #تخفیف : ${displayDiscount}`
                    );

                }


                if (weightVal) {

                    lines.push(
                        `وزن : ${toPersianDigits(
                            weightVal
                        )}`
                    );

                }


                if (quantityVal) {

                    lines.push(
                        `تعداد : ${quantityVal}`
                    );

                }


                if (scentVal) {

                    lines.push(
                        `رایحه : ${scentVal}`
                    );

                }


                if (
                    customTitle &&
                    customValue
                ) {

                    lines.push(
                        `${customTitle} : ${customValue}`
                    );

                } else if (customTitle) {

                    lines.push(
                        `${customTitle} :`
                    );

                } else if (customValue) {

                    lines.push(
                        `مقدار : ${customValue}`
                    );

                }


                lines.push('');

                lines.push(
                    '🛒 جهت خرید :'
                );


                lines.push(
                    PLATFORM_LINKS[
                        platform
                    ]
                );


                lines.push('');


                lines.push(
                    '🔗 شوینده بهداشتی "شما"\n@Shoma_shop'
                );


                return lines.join('\n');
            }


            // ==================== Preview ====================

            function updatePreview() {

                if (
                    document.activeElement ===
                    previewOutput
                ) {
                    return;
                }


                updateErrorDisplays();


                previewOutput.textContent =
                    buildCaption(
                        DEFAULT_PLATFORM
                    );
            }


            // ==================== Copy ====================

            async function copyCaption(
                platform
            ) {

                const text =
                    buildCaption(
                        platform
                    );


                try {

                    await navigator.clipboard.writeText(
                        text
                    );


                    showCopyFeedback(
                        platform === 'eitaa'
                            ? 'کپشن ایتا کپی شد'
                            : 'کپشن روبیکا کپی شد'
                    );

                } catch (error) {

                    fallbackCopy(
                        text,
                        platform
                    );

                }

            }


            function fallbackCopy(
                text,
                platform
            ) {

                const textarea =
                    document.createElement(
                        'textarea'
                    );


                textarea.value =
                    text;


                textarea.style.position =
                    'fixed';


                textarea.style.opacity =
                    '0';


                document.body.appendChild(
                    textarea
                );


                textarea.select();


                try {

                    document.execCommand(
                        'copy'
                    );


                    showCopyFeedback(
                        platform === 'eitaa'
                            ? 'کپشن ایتا کپی شد'
                            : 'کپشن روبیکا کپی شد'
                    );

                } catch (error) {

                    alert(
                        'کپی ناموفق'
                    );

                }


                document.body.removeChild(
                    textarea
                );
            }


            // ==================== Notification ====================

            function showCopyFeedback(
                message
            ) {

                copyFeedback.textContent =
                    message;


                copyFeedback.classList.add(
                    'show'
                );


                clearTimeout(
                    window._copyTimer
                );


                window._copyTimer =
                    setTimeout(
                        () => {

                            copyFeedback.classList.remove(
                                'show'
                            );

                        },
                        1200
                    );

            }


            // ==================== Clear ====================

            function updateClearButtons() {

                const fieldMap = {

                    productName:
                        productNameEl,

                    price:
                        priceEl,

                    discountPrice:
                        discountPriceEl,

                    weight:
                        weightEl,

                    quantity:
                        quantityEl,

                    scent:
                        scentEl,

                    customTitle:
                        customTitleEl,

                    customValue:
                        customValueEl

                };


                allClearButtons.forEach(
                    btn => {

                        const targetId =
                            btn.dataset.target;


                        const input =
                            fieldMap[
                                targetId
                            ];


                        if (
                            input &&
                            input.value
                                .trim()
                                .length > 0
                        ) {

                            btn.parentElement
                                .classList
                                .add(
                                    'has-value'
                                );

                        } else {

                            btn.parentElement
                                .classList
                                .remove(
                                    'has-value'
                                );

                        }

                    }
                );
            }


            function clearAllFields() {

                productNameEl.value = '';
                priceEl.value = '';
                discountPriceEl.value = '';
                weightEl.value = '';
                quantityEl.value = '';
                scentEl.value = '';
                customTitleEl.value = '';
                customValueEl.value = '';


                nameLengthError.classList.remove(
                    'visible'
                );

                priceError.classList.remove(
                    'visible'
                );

                discountError.classList.remove(
                    'visible'
                );

                discountCompareError.classList.remove(
                    'visible'
                );


                updateClearButtons();
                updatePreview();


                productNameEl.focus();
            }


            // ==================== Theme ====================

            function applyTheme(theme) {

                if (theme === 'light') {

                    document.body.classList.add(
                        'light-mode'
                    );


                    themeIcon.textContent =
                        '☀️';


                    themeLabel.textContent =
                        'روشن';

                } else {

                    document.body.classList.remove(
                        'light-mode'
                    );


                    themeIcon.textContent =
                        '🌙';


                    themeLabel.textContent =
                        'تاریک';
                }


                localStorage.setItem(
                    'caption-theme',
                    theme
                );
            }


            function toggleTheme() {

                applyTheme(
                    document.body.classList.contains(
                        'light-mode'
                    )
                        ? 'dark'
                        : 'light'
                );

            }


            // ==================== Events ====================

            allInputs.forEach(
                input => {

                    input.addEventListener(
                        'input',
                        () => {

                            updateClearButtons();
                            updatePreview();

                        }
                    );


                    input.addEventListener(
                        'paste',
                        () => {

                            setTimeout(
                                () => {

                                    updateClearButtons();
                                    updatePreview();

                                },
                                30
                            );

                        }
                    );

                }
            );


            allClearButtons.forEach(
                btn => {

                    btn.addEventListener(
                        'click',
                        event => {

                            const targetId =
                                event.currentTarget
                                    .dataset
                                    .target;


                            const input =
                                document.getElementById(
                                    targetId
                                );


                            if (input) {

                                input.value = '';


                                input.dispatchEvent(
                                    new Event(
                                        'input',
                                        {
                                            bubbles: true
                                        }
                                    )
                                );


                                input.focus();

                            }

                        }
                    );

                }
            );


            // کپی ایتا

            copyEitaaBtn.addEventListener(
                'click',
                () =>
                    copyCaption(
                        'eitaa'
                    )
            );


            // کپی روبیکا

            copyRubikaBtn.addEventListener(
                'click',
                () =>
                    copyCaption(
                        'rubika'
                    )
            );


            // پاک کردن فرم

            clearFormBtn.addEventListener(
                'click',
                clearAllFields
            );


            // تغییر تم

            themeToggle.addEventListener(
                'click',
                toggleTheme
            );


            // ==================== Init ====================

            const savedTheme =
                localStorage.getItem(
                    'caption-theme'
                ) || 'dark';


            applyTheme(
                savedTheme
            );


            updateClearButtons();
            updatePreview();


            productNameEl.focus();

        })();
    </script>

</body>
