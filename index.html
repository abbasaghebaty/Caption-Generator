<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت کپشن فروشگاهی | شما شاپ</title>

    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

    <style>
        /* ==================== متغیرهای تم ==================== */
        :root {
            --bg: #0f0f0f;
            --surface: rgba(30, 30, 30, 0.8);
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(20, 20, 20, 0.7);
            --accent: #6c5ce7;
            --accent-hover: #7d6ff0;
            --error: #e17055;
            --success: #00b894;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --blur: 12px;
            --transition: 0.3s ease;
            --header-bg: rgba(15, 15, 15, 0.6);
        }

        body.light-mode {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.75);
            --text: #1a1a1a;
            --text-secondary: #555;
            --border: rgba(0, 0, 0, 0.06);
            --input-bg: rgba(240, 240, 240, 0.8);
            --accent: #6c5ce7;
            --accent-hover: #5a4bd1;
            --error: #d63031;
            --success: #00b894;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --header-bg: rgba(255, 255, 255, 0.5);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0.5rem 1.5rem;
            background: var(--header-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            flex-shrink: 0;
        }

        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            backdrop-filter: blur(4px);
            background: var(--input-bg);
        }

        .theme-toggle-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 52px);
            gap: 1.2rem;
            padding: 1.2rem;
            overflow: hidden;
        }

        .card {
            background: var(--surface);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.25rem;
            transition: background var(--transition), border var(--transition);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .preview-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            position: relative;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .required-mark {
            color: var(--error);
            font-size: 1rem;
            line-height: 1;
        }

        .optional-mark {
            font-size: 0.65rem;
            background: var(--border);
            color: var(--text-secondary);
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            font-weight: 400;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 0.65rem 2.2rem 0.65rem 0.8rem;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            transition: all var(--transition);
            outline: none;
            width: 100%;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .input-group input::placeholder {
            color: #666;
            font-size: 0.75rem;
        }

        .clear-field-btn {
            position: absolute;
            left: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 1.8rem;
            height: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all var(--transition);
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            tab-index: -1;
        }

        .input-wrapper.has-value .clear-field-btn {
            opacity: 0.6;
            pointer-events: auto;
        }

        .clear-field-btn:hover {
            opacity: 1 !important;
            background: rgba(255, 255, 255, 0.1);
            color: var(--error);
        }

        .error-message {
            color: var(--error);
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 0.2rem;
            display: none;
            align-items: center;
            gap: 0.3rem;
        }

        .error-message.visible {
            display: flex;
        }

        .platform-buttons {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }

        .platform-btn {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border: 2px solid var(--border);
            background: var(--input-bg);
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all var(--transition);
        }

        .platform-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .platform-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.4);
        }

        .action-buttons {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.6rem;
            flex-shrink: 0;
        }

        .btn {
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            flex: 1;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 14px rgba(108, 92, 231, 0.35);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-secondary);
            flex: 1;
        }

        .btn-outline:hover {
            border-color: #888;
            color: var(--text);
            background: rgba(255,255,255,0.05);
        }

        .preview-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.9;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: var(--text);
            outline: none;
            transition: border var(--transition);
            overflow-y: auto;
            min-height: 0;
        }

        .preview-box:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.2);
        }

        .preview-box[contenteditable="true"]:empty::before {
            content: "پیش‌نمایش کپشن در اینجا ظاهر می‌شود...";
            color: #666;
            font-style: italic;
        }

        .copy-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-shrink: 0;
        }

        .copy-feedback {
            font-size: 0.75rem;
            color: var(--success);
            font-weight: 600;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .copy-feedback.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
            }

            .main-container {
                flex-direction: column;
                height: auto;
                padding: 1rem;
                gap: 1rem;
                overflow-y: visible;
            }

            .form-section,
            .preview-section {
                flex: none;
                width: 100%;
                overflow-y: visible;
                height: auto;
            }

            .preview-box {
                min-height: 180px;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="theme-toggle-btn" id="themeToggle" title="تغییر تم">
            <span id="themeIcon">🌙</span>
            <span id="themeLabel">تاریک</span>
        </button>
    </header>

    <main class="main-container">
        <!-- بخش فرم -->
        <section class="form-section card">
            <div class="section-title">📋 اطلاعات محصول</div>
            <div class="form-grid">
                <!-- نام محصول -->
                <div class="input-group">
                    <label for="productName">نام محصول <span class="required-mark">●</span></label>
                    <div class="input-wrapper" id="nameWrapper">
                        <input type="text" id="productName" placeholder="مثال: مایع ظرفشویی" autocomplete="off" maxlength="100">
                        <button class="clear-field-btn" data-target="productName" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                    <div class="error-message" id="nameLengthError">⚠️ حداکثر ۴۰ کاراکتر مجاز است</div>
                </div>

                <!-- قیمت -->
                <div class="input-group">
                    <label for="price">قیمت <span class="required-mark">●</span></label>
                    <div class="input-wrapper" id="priceWrapper">
                        <input type="text" id="price" placeholder="فقط عدد (مثال: ۴۵۰۰۰)" autocomplete="off">
                        <button class="clear-field-btn" data-target="price" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                    <div class="error-message" id="priceError">عزیزم قیمت باید عدد باشه 🙂</div>
                </div>

                <!-- قیمت با تخفیف -->
                <div class="input-group">
                    <label for="discountPrice">قیمت با تخفیف <span class="optional-mark">اختیاری</span></label>
                    <div class="input-wrapper" id="discountWrapper">
                        <input type="text" id="discountPrice" placeholder="فقط عدد (مثال: ۳۵۰۰۰)" autocomplete="off">
                        <button class="clear-field-btn" data-target="discountPrice" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                    <div class="error-message" id="discountError">عزیزم قیمت باید عدد باشه 🙂</div>
                    <div class="error-message" id="discountCompareError">کسخل قیمت با تخفیف باید کمتر باشه</div>
                </div>

                <!-- وزن -->
                <div class="input-group">
                    <label for="weight">وزن <span class="optional-mark">اختیاری</span></label>
                    <div class="input-wrapper" id="weightWrapper">
                        <input type="text" id="weight" placeholder="مثال: ۷۵۰ گرم" autocomplete="off">
                        <button class="clear-field-btn" data-target="weight" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                </div>

                <!-- تعداد -->
                <div class="input-group">
                    <label for="quantity">تعداد <span class="optional-mark">اختیاری</span></label>
                    <div class="input-wrapper" id="quantityWrapper">
                        <input type="text" id="quantity" placeholder="مثال: ۲ عدد" autocomplete="off">
                        <button class="clear-field-btn" data-target="quantity" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                </div>

                <!-- رایحه -->
                <div class="input-group">
                    <label for="scent">رایحه <span class="optional-mark">اختیاری</span></label>
                    <div class="input-wrapper" id="scentWrapper">
                        <input type="text" id="scent" placeholder="مثال: لیمو" autocomplete="off">
                        <button class="clear-field-btn" data-target="scent" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                </div>

                <!-- عنوان و مقدار سفارشی -->
                <div class="input-group">
                    <label for="customTitle">عنوان <span class="optional-mark">اختیاری</span></label>
                    <div class="input-wrapper" id="customTitleWrapper">
                        <input type="text" id="customTitle" placeholder="مثال: نوع" autocomplete="off">
                        <button class="clear-field-btn" data-target="customTitle" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="customValue">مقدار <span class="optional-mark">اختیاری</span></label>
                    <div class="input-wrapper" id="customValueWrapper">
                        <input type="text" id="customValue" placeholder="مثال: نرم کننده" autocomplete="off">
                        <button class="clear-field-btn" data-target="customValue" tabindex="-1" title="پاک کردن">×</button>
                    </div>
                </div>

                <!-- انتخاب پلتفرم -->
                <div class="platform-buttons" id="platformButtons">
                    <button class="platform-btn active" data-platform="eitaa">ایتا</button>
                    <button class="platform-btn" data-platform="rubika">روبیکا</button>
                </div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-outline" id="clearFormBtn">🗑️ پاک کردن فرم</button>
            </div>
        </section>

        <!-- بخش پیش‌نمایش -->
        <section class="preview-section card">
            <div class="section-title">✨ پیش‌نمایش کپشن</div>
            <div class="preview-box" id="previewOutput" contenteditable="true" role="textbox" aria-label="پیش‌نمایش کپشن"></div>
            <div class="copy-row">
                <button class="btn btn-primary" id="copyBtn">📋 کپی کپشن</button>
                <span class="copy-feedback" id="copyFeedback">کپی شد ✅</span>
            </div>
        </section>
    </main>

    <script>
        (function() {
            // ==================== DOM Elements ====================
            const productNameEl = document.getElementById('productName');
            const priceEl = document.getElementById('price');
            const discountPriceEl = document.getElementById('discountPrice');
            const weightEl = document.getElementById('weight');
            const quantityEl = document.getElementById('quantity');
            const scentEl = document.getElementById('scent');
            const customTitleEl = document.getElementById('customTitle');
            const customValueEl = document.getElementById('customValue');
            const nameLengthError = document.getElementById('nameLengthError');
            const priceError = document.getElementById('priceError');
            const discountError = document.getElementById('discountError');
            const discountCompareError = document.getElementById('discountCompareError');
            const platformButtons = document.querySelectorAll('.platform-btn');
            const previewOutput = document.getElementById('previewOutput');
            const copyBtn = document.getElementById('copyBtn');
            const clearFormBtn = document.getElementById('clearFormBtn');
            const copyFeedback = document.getElementById('copyFeedback');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');
            const allClearButtons = document.querySelectorAll('.clear-field-btn');

            let selectedPlatform = 'eitaa';
            const PLATFORM_LINKS = {
                eitaa: 'https://eitaa.com/shoma_shop/12',
                rubika: 'https://rubika.ir/shoma_shop/BHBJBCCDHAJFJFHJ'
            };

            // ==================== Helper Functions ====================
            const toEnglishDigits = (str) => str.replace(/[۰-۹]/g, d => String.fromCharCode(d.charCodeAt(0) - 1728));
            const toPersianDigits = (str) => str.replace(/[0-9]/g, d => String.fromCharCode(d.charCodeAt(0) + 1728));

            // نرمال‌سازی فاصله‌ها (شامل حذف نیم‌فاصله‌ها)
            function normalizeText(str) {
                return str.replace(/\u200C/g, ' ').trim().replace(/\s+/g, ' ');
            }

            // حذف کلمات تکراری پشت سر هم
            function removeDuplicateWords(str) {
                const words = str.split(' ');
                const result = [];
                for (const word of words) {
                    if (result.length === 0 || word !== result[result.length - 1]) {
                        result.push(word);
                    }
                }
                return result.join(' ');
            }

            // میانبرهای نام محصول (گسترش‌یافته و اصلاح‌شده)
            function transformProductName(name) {
                if (!name) return name;

                // ترتیب قوانین (اولویت‌بندی طولانی‌ترین پیشوندها)
                const rules = [
                    // قانون‌های قبلی (تیرک حذف شده)
                    { prefixes: ['مایع ظرفشویی', 'مایع ظرف', 'ظرف'], replacement: 'مایع ظرفشویی (ریکا)' },
                    { prefixes: ['مایع دستشویی', 'مایع دست'], replacement: 'مایع دستشویی' },
                    { prefixes: ['دستی'], replacement: 'پودر دستی (تاید)' },
                    { prefixes: ['دست'], replacement: 'مایع دستشویی' },
                    { prefixes: ['ریکا'], replacement: 'مایع ظرفشویی (ریکا)' },
                    { prefixes: ['ماشینی'], replacement: 'پودر ماشینی (تاید)' },

                    // جدید: سفید کننده
                    { prefixes: ['سفید کننده', 'سفیدکننده'], replacement: 'سفید کننده (وایتکس)' },

                    // رخشا
                    { prefixes: ['رخشا'], replacement: 'پودر رخشا' },

                    // گلنار
                    { prefixes: ['گلنار'], replacement: 'صابون گلنار' },

                    // نوار بهداشتی
                    { prefixes: ['مای لیدی', 'مولپد', 'گود مود', 'گودمود'], replacement: (prefix) => `نوار بهداشتی ${prefix}` },

                    // رختشویی
                    { prefixes: ['رختشویی', 'رخت شویی'], replacement: 'صابون رختشویی' },

                    // خمیردندان
                    { prefixes: ['خمیر دندان', 'خمیردندان', 'خمیر دندون', 'خمیردندون'], replacement: 'خمیردندان' }
                ];

                for (const rule of rules) {
                    for (const prefix of rule.prefixes) {
                        if (name.startsWith(prefix)) {
                            let rest = name.slice(prefix.length).trim();

                            // حذف تکرار همین پیشوندها از ابتدای rest
                            const prefixesToStrip = rule.prefixes;
                            let changed = true;
                            while (changed && rest.length > 0) {
                                changed = false;
                                for (const p of prefixesToStrip) {
                                    if (rest.startsWith(p)) {
                                        rest = rest.slice(p.length).trim();
                                        changed = true;
                                        break;
                                    }
                                }
                            }

                            const repl = typeof rule.replacement === 'function' ? rule.replacement(prefix) : rule.replacement;
                            return rest ? `${repl} ${rest}` : repl;
                        }
                    }
                }

                return name; // بدون تغییر
            }

            // مدیریت نمایش خطاها
            function updateErrorDisplays() {
                const rawName = normalizeText(productNameEl.value);
                const transformed = transformProductName(rawName);
                const deduped = removeDuplicateWords(transformed);
                nameLengthError.classList.toggle('visible', rawName && deduped.length > 40);

                const priceVal = priceEl.value.trim();
                priceError.classList.toggle('visible', priceVal && !/^[0-9۰-۹]+$/.test(priceVal));

                const discountVal = discountPriceEl.value.trim();
                discountError.classList.toggle('visible', discountVal && !/^[0-9۰-۹]+$/.test(discountVal));
                discountCompareError.classList.remove('visible');
                if (discountVal && /^[0-9۰-۹]+$/.test(discountVal) && priceVal && /^[0-9۰-۹]+$/.test(priceVal)) {
                    const p = parseInt(toEnglishDigits(priceVal), 10);
                    const d = parseInt(toEnglishDigits(discountVal), 10);
                    if (d >= p) discountCompareError.classList.add('visible');
                }
            }

            // ساخت کپشن زنده
            function buildCaption() {
                const rawName = normalizeText(productNameEl.value);
                const transformed = transformProductName(rawName);
                const name = removeDuplicateWords(transformed);

                const priceVal = priceEl.value.trim();
                const discountVal = discountPriceEl.value.trim();
                const weightVal = normalizeText(weightEl.value);
                const quantityVal = normalizeText(quantityEl.value);
                const scentVal = normalizeText(scentEl.value);
                const customTitle = normalizeText(customTitleEl.value);
                const customValue = normalizeText(customValueEl.value);

                const lines = [];

                if (rawName) lines.push(name);
                if (priceVal) {
                    const displayPrice = /^[0-9۰-۹]+$/.test(priceVal) ? toEnglishDigits(priceVal) : priceVal;
                    lines.push(`قیمت : ${displayPrice}`);
                }
                if (discountVal && /^[0-9۰-۹]+$/.test(discountVal)) {
                    if (priceVal && /^[0-9۰-۹]+$/.test(priceVal)) {
                        const p = parseInt(toEnglishDigits(priceVal), 10);
                        const d = parseInt(toEnglishDigits(discountVal), 10);
                        if (d < p) lines.push(`با #تخفیف : ${toEnglishDigits(discountVal)}`);
                    }
                }
                if (weightVal) lines.push(`وزن : ${toPersianDigits(weightVal)}`);
                if (quantityVal) lines.push(`تعداد: ${quantityVal}`);
                if (scentVal) lines.push(`رایحه : ${scentVal}`);
                if (customTitle && customValue) lines.push(`${customTitle}: ${customValue}`);

                lines.push('');
                lines.push('🛒 جهت خرید :');
                lines.push(PLATFORM_LINKS[selectedPlatform]);
                lines.push('');
                lines.push('🔗 مواد شوینده "شما"\n@Shoma_shop');

                return lines.join('\n');
            }

            function updatePreview() {
                if (document.activeElement === previewOutput) return;
                updateErrorDisplays();
                previewOutput.textContent = buildCaption();
            }

            function updateClearButtons() {
                const fieldMap = {
                    productName: productNameEl,
                    price: priceEl,
                    discountPrice: discountPriceEl,
                    weight: weightEl,
                    quantity: quantityEl,
                    scent: scentEl,
                    customTitle: customTitleEl,
                    customValue: customValueEl
                };
                allClearButtons.forEach(btn => {
                    const targetId = btn.dataset.target;
                    const input = fieldMap[targetId];
                    if (input && input.value.trim().length > 0) {
                        btn.parentElement.classList.add('has-value');
                    } else {
                        btn.parentElement.classList.remove('has-value');
                    }
                });
            }

            async function copyCaption() {
                const text = previewOutput.textContent || '';
                if (!text.trim()) {
                    alert('⚠️ پیش‌نمایشی برای کپی وجود ندارد.');
                    return;
                }
                try {
                    await navigator.clipboard.writeText(text);
                    showCopyFeedback();
                } catch (err) {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); showCopyFeedback(); } catch (e) { alert('❌ کپی ناموفق'); }
                document.body.removeChild(ta);
            }

            function showCopyFeedback() {
                copyFeedback.classList.add('show');
                clearTimeout(window._copyTimer);
                window._copyTimer = setTimeout(() => copyFeedback.classList.remove('show'), 2000);
            }

            function clearAllFields() {
                productNameEl.value = '';
                priceEl.value = '';
                discountPriceEl.value = '';
                weightEl.value = '';
                quantityEl.value = '';
                scentEl.value = '';
                customTitleEl.value = '';
                customValueEl.value = '';
                nameLengthError.classList.remove('visible');
                priceError.classList.remove('visible');
                discountError.classList.remove('visible');
                discountCompareError.classList.remove('visible');
                platformButtons.forEach(b => b.classList.remove('active'));
                document.querySelector('.platform-btn[data-platform="eitaa"]').classList.add('active');
                selectedPlatform = 'eitaa';
                updateClearButtons();
                updatePreview();
                productNameEl.focus();
            }

            function applyTheme(theme) {
                if (theme === 'light') {
                    document.body.classList.add('light-mode');
                    themeIcon.textContent = '☀️';
                    themeLabel.textContent = 'روشن';
                } else {
                    document.body.classList.remove('light-mode');
                    themeIcon.textContent = '🌙';
                    themeLabel.textContent = 'تاریک';
                }
                localStorage.setItem('caption-theme', theme);
            }

            function toggleTheme() {
                applyTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light');
            }

            // ==================== Event Listeners ====================
            platformButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    platformButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedPlatform = btn.dataset.platform;
                    updatePreview();
                });
            });

            const allInputs = [productNameEl, priceEl, discountPriceEl, weightEl, quantityEl, scentEl, customTitleEl, customValueEl];
            allInputs.forEach(input => {
                input.addEventListener('input', () => {
                    updateClearButtons();
                    updatePreview();
                });
                input.addEventListener('paste', () => setTimeout(() => {
                    updateClearButtons();
                    updatePreview();
                }, 30));
            });

            allClearButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetId = e.currentTarget.dataset.target;
                    const input = document.getElementById(targetId);
                    if (input) {
                        input.value = '';
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                        input.focus();
                    }
                });
            });

            copyBtn.addEventListener('click', copyCaption);
            clearFormBtn.addEventListener('click', clearAllFields);
            themeToggle.addEventListener('click', toggleTheme);

            // Init
            const savedTheme = localStorage.getItem('caption-theme') || 'dark';
            applyTheme(savedTheme);
            updateClearButtons();
            updatePreview();
            productNameEl.focus();
        })();
    </script>
</body>
</html>
